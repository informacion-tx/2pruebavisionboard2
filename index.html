<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COCOA - TexGo Colombia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Bell MT', 'Playfair Display', 'Times New Roman', serif;
        }

        /* Contenedor del Póster */
        .poster {
            position: relative;
            width: 100%;
            max-width: 850px;
            aspect-ratio: 1 / 1.37;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.85);
        }

        /* 1. Logo TexGo */
        .logo {
            position: absolute !important;
            top: -1.5% !important;
            left: -2% !important;
            width: 32% !important;
            max-width: 260px !important;
            z-index: 20 !important;
            filter: drop-shadow(2px 4px 8px rgba(0, 0, 0, 0.35));
        }

        .logo img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* 2. Modelo */
        .model-container {
            position: absolute !important;
            left: -12% !important;
            bottom: -14% !important;
            height: 98% !important;
            z-index: 5 !important;
            display: flex !important;
            align-items: flex-end !important;
            pointer-events: none;
        }

        /* Sombra proyectada en el piso */
        .model-shadow {
            position: absolute;
            bottom: 0px;
            left: 15%;
            width: 75%;
            height: 25px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0) 80%);
            border-radius: 50%;
            z-index: 4;
            transform: scaleY(0.35);
            filter: blur(7px);
        }

        .model-container img {
            height: 100% !important;
            width: auto !important;
            display: block !important;
            object-fit: contain !important;
            object-position: bottom left !important;
            position: relative;
            z-index: 5;
            filter: drop-shadow(-10px 14px 20px rgba(0, 0, 0, 0.4));
        }

        /* Bloque de Información Superior Derecha */
        .info-block {
            position: absolute !important;
            top: 7.5% !important;
            right: 8% !important;
            z-index: 10 !important;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        /* Título COCOA */
        .title-container {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .title {
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(3.2rem, 8.2vw, 6.2rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #0a0a0a;
            line-height: 0.9;
            text-shadow: 3px 4px 8px rgba(0, 0, 0, 0.3), 1px 1px 2px rgba(255, 255, 255, 0.4);
        }

        /* Composición de Material */
        .composition {
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(0.85rem, 2vw, 1.4rem);
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 0.12em;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.25), 1px 1px 1px rgba(255, 255, 255, 0.3);
        }

        /* Especificaciones Técnicas */
        .specs {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            align-items: flex-end;
        }

        .spec-text {
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(0.85rem, 2vw, 1.4rem);
            font-weight: 600;
            color: #0a0a0a;
            letter-spacing: 0.08em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.25), 1px 1px 1px rgba(255, 255, 255, 0.3);
            white-space: nowrap;
        }

        /* Botón "COLORES" en la parte inferior derecha */
        .btn-colors {
            position: absolute;
            bottom: 6%;
            right: 6%;
            z-index: 15;
            background: rgba(10, 10, 10, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px 28px;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(0.9rem, 1.8vw, 1.3rem);
            font-weight: 600;
            letter-spacing: 0.15em;
            cursor: pointer;
            backdrop-filter: blur(5px);
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .btn-colors:hover {
            background: #ffffff;
            color: #0a0a0a;
            border-color: #0a0a0a;
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.4);
        }

        /* Interfaz Modal de Colores */
        .colors-modal {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .colors-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            color: #ffffff;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Grid de Muestras en la Modal */
        .colors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 680px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 10px;
        }

        .color-card {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transition: transform 0.25s ease;
        }

        .color-card:hover {
            transform: translateY(-5px);
        }

        /* Cuadro de color con borde delgado blanco */
        .color-box {
            height: 85px;
            width: 100%;
            border: 1px solid #ffffff;
            box-sizing: border-box;
        }

        .color-name {
            padding: 8px 4px;
            text-align: center;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #0a0a0a;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Botón para cerrar la Modal */
        .btn-close {
            margin-top: 25px;
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 24px;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 4px;
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .poster {
                box-shadow: none;
            }
            .logo {
                width: 38% !important;
            }
            .model-container {
                left: -15% !important;
            }
            .info-block {
                right: 6% !important;
            }
            .colors-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="poster">
        <!-- Logo TexGo -->
        <div class="logo">
            <img src="logo.png" alt="TexGo Logo">
        </div>

        <!-- Modelo con Sombra de Piso -->
        <div class="model-container">
            <div class="model-shadow"></div>
            <img src="model.png" alt="Modelo Cocoa">
        </div>

        <!-- Bloque de Información -->
        <div class="info-block">
            <!-- Título COCOA -->
            <div class="title-container">
                <h1 class="title">COCOA</h1>
            </div>

            <!-- Composición de la Tela -->
            <div class="composition">100% POLIESTER</div>

            <!-- Especificaciones Técnicas -->
            <div class="specs">
                <span class="spec-text">275 GM2 (+/-5%)</span>
                <span class="spec-text">152 CM (+/-5%)</span>
            </div>
        </div>

        <!-- Botón Interactivo Colores -->
        <button class="btn-colors" onclick="openColors()">COLORES</button>

        <!-- Interfaz Modal de Galería de Colores -->
        <div class="colors-modal" id="colorsModal">
            <h2 class="modal-title">COLORES DISPONIBLES</h2>
            <div class="colors-grid">
                <div class="color-card">
                    <div class="color-box" style="background-color: #F4EFE3;"></div>
                    <div class="color-name">MARFIL</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #E8DCC4;"></div>
                    <div class="color-name">CREMA</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #F8D9D9;"></div>
                    <div class="color-name">BALLET</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #FBE28E;"></div>
                    <div class="color-name">SORBETE</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #B9D0C1;"></div>
                    <div class="color-name">SALVIA</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #8C826E;"></div>
                    <div class="color-name">DARK SAND</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #B58456;"></div>
                    <div class="color-name">TANG</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #4C3C37;"></div>
                    <div class="color-name">CHOCOLATE</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #4A0E17;"></div>
                    <div class="color-name">VINOTINTO</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #438084;"></div>
                    <div class="color-name">TEAL</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #12181E;"></div>
                    <div class="color-name">JET BLACK</div>
                </div>
            </div>
            <button class="btn-close" onclick="closeColors()">CERRAR</button>
        </div>
    </div>

    <script>
        function openColors() {
            document.getElementById('colorsModal').classList.add('active');
        }

        function closeColors() {
            document.getElementById('colorsModal').classList.remove('active');
        }
    </script>

</body>
</html>
